[package]
name = "enkaku-desktop"
version = "0.0.1"
description = "Enkaku — device farm desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# webview-data-url: used for the error page when the core fails to start.
tauri = { version = "2", features = ["tray-icon", "webview-data-url"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by `tauri dev` to enable devtools.
custom-protocol = ["tauri/custom-protocol"]
