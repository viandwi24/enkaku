# Scoped to this package, exactly like `packages/studio/bunfig.toml`: Bun reads
# a single bunfig.toml resolved from the invocation's own cwd, so this only
# takes effect for `bun run --cwd packages/ui test`. The component tests here
# render through `@testing-library/react`, which needs a real DOM registered
# BEFORE `@testing-library/dom` is first evaluated — a plain top-of-file import
# is too late (see `happydom.ts`). The root `bunfig.toml` therefore excludes
# this package from its own scan, the same arrangement Studio has had since
# plan 72.
[test]
preload = ["./happydom.ts"]
