# coturn for Enkaku (plan 13 §4.5).
#
# TURN is needed when a client sits behind symmetric NAT or on a network that
# blocks direct UDP. Without it, some users always fall back to the WebSocket
# path, which is prone to freezing.

listening-port=3478
tls-listening-port=5349

# Time-limited credentials: the username carries the expiry, and the password is
# an HMAC of the username. This secret must match ENKAKU_TURN_SECRET on the
# control plane.
use-auth-secret
static-auth-secret=REPLACE_WITH_A_LONG_RANDOM_SECRET

realm=farm.example.com
fingerprint
no-multicast-peers
# Never allow relaying into internal networks — an open TURN server can be
# abused to punch through your own firewall.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# TLS (required when clients are on networks that only allow 443)
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem
