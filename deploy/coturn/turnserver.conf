# coturn untuk Enkaku (plan 13 §4.5).
#
# TURN dibutuhkan saat klien berada di balik NAT simetris atau jaringan yang
# memblokir UDP langsung. Tanpa ini, sebagian pengguna akan selalu jatuh ke
# jalur WebSocket yang rentan freeze.

listening-port=3478
tls-listening-port=5349

# Kredensial berjangka waktu: username berisi expiry, password = HMAC dari
# username. Rahasia ini harus sama dengan ENKAKU_TURN_SECRET di control plane.
use-auth-secret
static-auth-secret=GANTI_DENGAN_RAHASIA_PANJANG_ACAK

realm=farm.example.com
fingerprint
no-multicast-peers
# Jangan izinkan relay ke jaringan internal — TURN yang terbuka bisa
# disalahgunakan untuk menembus firewall Anda sendiri.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# TLS (wajib bila klien di jaringan yang hanya mengizinkan 443)
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem
