services:
  core:
    build: .
    ports:
      - '7700:7700'
    volumes:
      - enkaku-data:/data
    environment:
      # Non-loopback bind ⇒ server mode ⇒ login required.
      ENKAKU_BIND: 0.0.0.0
      # Behind a reverse proxy that terminates TLS:
      ENKAKU_TLS_MODE: external
      # Quick test without TLS (DO NOT use in production):
      # ENKAKU_ALLOW_INSECURE: '1'
    # Wireless ADB is recommended for containers. For USB passthrough
    # on a Linux host, uncomment the following:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped

volumes:
  enkaku-data:
